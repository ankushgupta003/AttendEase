name: Release Desktop

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Install Server Backend Dependencies
        run: npm --prefix backend-postgres ci

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build And Publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:desktop:publish:ci

      - name: Build Server EXE
        run: npm --prefix backend-postgres run build:exe

      - name: Build Server Installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $candidates = @(
              "$env:ProgramFiles(x86)\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe",
              "C:\ProgramData\chocolatey\bin\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            throw "makensis.exe was not found after NSIS install."
          }
          & $makensis "server-installer\installer.nsi"

      - name: Upload Server Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: server-installer/AttendEase-Server-Setup.exe
