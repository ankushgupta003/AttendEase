name: Release Desktop

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Install Server Backend Dependencies
        run: npm --prefix backend-postgres ci

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build And Publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:desktop:publish:ci

      - name: Build Server EXE
        run: npm --prefix backend-postgres run build:exe

      - name: Build Server Installer
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" "server-installer\installer.nsi"'

      - name: Upload Server Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: server-installer/AttendEase-Server-Setup.exe
