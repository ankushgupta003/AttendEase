name: Release Desktop

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Configure npm retries
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install Dependencies
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $max) {
              Write-Host "npm ci failed (attempt $i/$max). Retrying in 20s..."
              Start-Sleep -Seconds 20
            }
          }
          throw "npm ci failed after $max attempts."

      - name: Install Backend Dependencies
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            npm --prefix backend ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $max) {
              Write-Host "backend npm ci failed (attempt $i/$max). Retrying in 15s..."
              Start-Sleep -Seconds 15
            }
          }
          throw "backend npm ci failed after $max attempts."

      - name: Install Server Backend Dependencies
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            npm --prefix backend-postgres ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $max) {
              Write-Host "backend-postgres npm ci failed (attempt $i/$max). Retrying in 15s..."
              Start-Sleep -Seconds 15
            }
          }
          throw "backend-postgres npm ci failed after $max attempts."

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $candidates = @(
              "$env:ProgramFiles(x86)\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe",
              "C:\ProgramData\chocolatey\bin\makensis.exe",
              "C:\ProgramData\chocolatey\lib\nsis\tools\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            $makensis = (Get-ChildItem "C:\ProgramData\chocolatey" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $makensis) {
            throw "makensis.exe was not found after NSIS install."
          }

          Write-Host "Resolved makensis: $makensis"
          & $makensis /VERSION
          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve App Version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not $version) { throw "Unable to read version from package.json" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved APP_VERSION=$version"

      - name: Build And Publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:desktop:publish:ci

      - name: Build Server EXE
        run: npm --prefix backend-postgres run build:exe

      - name: Build Server Installer
        shell: pwsh
        run: |
          if (-not $env:MAKENSIS_PATH) {
            throw "MAKENSIS_PATH is not set. NSIS install step did not resolve makensis.exe."
          }
          & "$env:MAKENSIS_PATH" "server-installer\installer.nsi"

      - name: Upload Server Installer to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: v${{ env.APP_VERSION }}
          overwrite_files: true
          files: server-installer/AttendEase-Server-Setup.exe
